name: Build and publish containers

# Builds the shared MATLAB base image, then the four processing containers,
# and pushes them to GHCR so downstream users can pull them without needing
# a MATLAB installation or licence of their own.
#
# LICENSING: the published images contain the MATLAB Runtime, which MathWorks
# permits redistributing royalty-free alongside a compiled application. No
# licence file reaches the published images -- network.lic exists only in the
# builder stage, which is discarded. See matlab-base/README.md.
#
# RUNNERS: every build compiles MATLAB code and therefore needs a licence
# checkout against the JPL licence servers named in network.lic. GitHub-hosted
# runners cannot reach those, so this workflow targets a self-hosted runner on
# the JPL network. Override the label set with the MATLAB_BUILDER_RUNNER repo
# variable (a JSON array, e.g. '["self-hosted","linux","x64"]').
#
# PLATFORM: linux/amd64 only. MathWorks publishes no Linux ARM64 MATLAB
# Runtime (glnxaarch64 / glnxarm64 both 404), so an arm64 image cannot be
# built. Apple Silicon users run the amd64 image under emulation.

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'matlab-base/**'
      - 'common/**'
      - 'iquam/**'
      - 'l2p/**'
      - 'landice/**'
      - 'mrva/**'
      - '.github/workflows/build-containers.yml'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules to build (JSON array, or "all")'
        required: false
        default: 'all'
      rebuild_base:
        description: 'Force a rebuild of the MATLAB base image'
        type: boolean
        required: false
        default: false

concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: mur-matlab-base
  BASE_TAG: r2024b
  PLATFORM: linux/amd64

jobs:
  # ---------------------------------------------------------------------
  # Resolve runner labels and the module list once.
  # ---------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.cfg.outputs.runner }}
      modules: ${{ steps.cfg.outputs.modules }}
    steps:
      - id: cfg
        run: |
          runner='${{ vars.MATLAB_BUILDER_RUNNER }}'
          if [ -z "$runner" ]; then
            runner='["self-hosted","linux","x64"]'
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

          modules='${{ github.event.inputs.modules }}'
          if [ -z "$modules" ] || [ "$modules" = "all" ]; then
            modules='["iquam","l2p","landice","mrva"]'
          fi
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

          echo "Runner labels: $runner"
          echo "Modules:       $modules"

  # ---------------------------------------------------------------------
  # ONE job builds the base and all four modules on the SAME runner.
  #
  # This is deliberate. The base image must never be pushed to a registry:
  # it contains a full licensed MATLAB installation plus network.lic, and
  # while MathWorks permits redistributing the MATLAB *Runtime* inside the
  # module images, it does not permit redistributing MATLAB itself.
  #
  # Building everything on one runner also means the base is built once and
  # reused by all four module builds. On a self-hosted runner the Docker
  # image store persists between workflow runs, so the base survives and is
  # only rebuilt when matlab-base/ or the pinned digest actually changes.
  # ---------------------------------------------------------------------
  build:
    needs: setup
    runs-on: ${{ fromJSON(needs.setup.outputs.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base is identified by a fingerprint of everything that affects it.
      # If an image with a matching fingerprint label is already in the
      # runner's local store, the multi-GB rebuild is skipped entirely.
      - name: Compute base image fingerprint
        id: fp
        run: |
          fp=$(sha256sum matlab-base/Dockerfile | cut -c1-16)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          have=$(docker image inspect "${BASE_IMAGE}:${BASE_TAG}" \
                   --format '{{index .Config.Labels "mur.base.fingerprint"}}' 2>/dev/null || echo "")
          if [ "$have" = "$fp" ] && [ "${{ github.event.inputs.rebuild_base }}" != "true" ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Base image is current (fingerprint $fp); reusing local image."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Base image missing or stale (have '$have', want '$fp'); rebuilding."
          fi

      # network.lic is gitignored and must never be committed. It is written
      # into the build context only for the base build, and removed straight
      # afterwards by the always() step below.
      - name: Write MATLAB licence file
        if: steps.fp.outputs.rebuild == 'true'
        run: |
          if [ -z "${{ secrets.MATLAB_NETWORK_LIC }}" ]; then
            echo "::error::Secret MATLAB_NETWORK_LIC is not set. It must contain the"
            echo "::error::contents of network.lic (SERVER/USE_SERVER lines)."
            exit 1
          fi
          printf '%s\n' "${{ secrets.MATLAB_NETWORK_LIC }}" > network.lic
          echo "Licence servers configured: $(grep -c '^SERVER' network.lic)"

      - name: Build MATLAB base image (local only, never pushed)
        if: steps.fp.outputs.rebuild == 'true'
        run: |
          docker build \
            --platform "${PLATFORM}" \
            --label "mur.base.fingerprint=${{ steps.fp.outputs.fingerprint }}" \
            --tag "${BASE_IMAGE}:${BASE_TAG}" \
            --file matlab-base/Dockerfile \
            .
          echo "Resolved MATLAB update level:"
          docker run --rm --entrypoint cat "${BASE_IMAGE}:${BASE_TAG}" \
            /opt/matlab/.update_level

      - name: Remove licence file from the workspace
        if: always()
        run: rm -f network.lic

      - name: Build and push module images
        env:
          MODULES: ${{ needs.setup.outputs.modules }}
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          sha="$(git rev-parse --short HEAD)"
          owner_repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          for module in $(echo "$MODULES" | tr -d '[]"' | tr ',' ' '); do
            image="${REGISTRY}/${owner_repo}/${module}"
            tags="-t ${image}:${branch} -t ${image}:${branch}-${sha}"
            if [ "$branch" = "main" ]; then
              tags="$tags -t ${image}:latest"
            fi

            echo "::group::Building ${module}"
            docker build \
              --platform "${PLATFORM}" \
              $tags \
              --file "${module}/Dockerfile" \
              .
            echo "::endgroup::"

            # Guard: the module images ARE published, so make certain no
            # licence material rode along from the builder stage.
            if docker run --rm --entrypoint sh "${image}:${branch}" -c \
                 'find / -name "*.lic" -not -path "*/matlabruntime/*" 2>/dev/null | head -1' \
               | grep -q .; then
              echo "::error::Licence file found in ${module} image; refusing to push."
              exit 1
            fi

            size=$(docker image inspect "${image}:${branch}" --format '{{.Size}}')
            printf '%s: %.2f GB\n' "$module" "$(echo "$size/1073741824" | bc -l)"

            docker push --all-tags "${image}"
          done

      - name: Confirm the base image was not published
        if: always()
        run: |
          if docker image inspect "${BASE_IMAGE}:${BASE_TAG}" \
               --format '{{.RepoTags}}' 2>/dev/null | grep -q "${REGISTRY}"; then
            echo "::error::Base image carries a registry tag; it must stay local."
            exit 1
          fi
          echo "OK: base image is local-only."
